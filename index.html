<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signup Form</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <div class="sidebar">
        <img
          class="background-image"
          src="images/halie-west-25xggax4bSA-unsplash.jpg"
          alt="Nature image"
        />
        <div class="logo-container">
          <img class="logo-image" src="images/odin-lined.png" alt="Odin Logo" />
          <span class="logo-name"><strong>ODIN</strong></span>
        </div>
        <div class="sidebar-footer">
          <div class="information">
            Photo by
            <a
              href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA"
              >Halie West</a
            >
            on
            <a
              href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA"
              >Unsplash</a
            >
          </div>
        </div>
      </div>

      <div class="main-content">
        <section>
          <p>
            This is not a real online service! You know you need something like
            this in your life to help you realize your deepest dreams.
            <br />Sign up <em>now</em> to get started.
          </p>
          <p>You <em>know</em> you want to.</p>
        </section>

        <section>
          <form>
            <p>Let's do this!</p>
            <div class="inputs">
              <div class="row">
                <div class="field">
                  <label for="first-name">FIRST NAME</label>
                  <input
                    type="text"
                    id="first-name"
                    name="first-name"
                    autocomplete="given-name"
                    required
                  />
                </div>
                <div class="field">
                  <label for="last-name">LAST NAME</label>
                  <input
                    type="text"
                    id="last-name"
                    name="last-name"
                    autocomplete="family-name"
                    required
                  />
                </div>
              </div>

              <div class="row">
                <div class="field">
                  <label for="email">EMAIL</label>
                  <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    placeholder="example@email.com"
                    required
                  />
                </div>
                <div class="field">
                  <label for="tel">PHONE NUMBER</label>
                  <input
                    type="tel"
                    id="tel"
                    name="tel"
                    pattern="[0-9\s]+"
                    autocomplete="tel"
                    required
                  />
                </div>
              </div>

              <div class="row">
                <div class="field">
                  <label for="password">PASSWORD</label>
                  <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="new-password"
                    required
                  />
                </div>

                <div class="field">
                  <label for="confirm-password">CONFIRM PASSWORD</label>
                  <input
                    type="password"
                    id="confirm-password"
                    name="confirm-password"
                    autocomplete="new-password"
                    required
                  />
                </div>
              </div>
            </div>

            <div class="create-account">
              <button type="submit">Create Account</button>
            </div>
          </form>

          <div class="login">
            Already have an account? <button type="button">Log in</button>
          </div>
        </section>
      </div>
    </div>
  </body>
</html>
